name: Sync Develop to Feature Branch

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  actions: write

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into feature branch
        run: |
          git checkout feature/develop
          git checkout --force origin/develop -- .github/workflows/sync-develop-to-feature.yml
          git add .github/workflows/sync-develop-to-feature.yml
          echo "Merging develop into feature/develop..."
          git merge --strategy-option=theirs origin/develop --no-ff -m "chore: sync develop into feature/develop"
          git push origin feature/develop

      - name: Trigger feature CI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for GitHub to process the git push..."
          sleep 5
          echo "Triggering the feature CI pipeline..."
          gh workflow run ci.yml --ref feature/develop