name: Sync Develop to Feature Branch

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  actions: write

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into feature branch
        run: |
          git checkout feature/develop
          echo "Merging develop into feature/develop..."
          git merge origin/develop --no-ff -m "chore: sync develop into feature/develop"
          git push origin feature/develop

      - name: Trigger feature CI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Feature Develop CI Pipeline" --ref feature/develop
