name: Sync Develop to Feature Branch

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-feature-develop
  cancel-in-progress: true

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync develop into feature branch
        id: sync
        run: |
          git checkout feature/develop
          git fetch origin develop
          git reset --hard origin/develop
          git push --force-with-lease origin feature/develop
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub to register the push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected="${{ steps.sync.outputs.synced_sha }}"
          for i in $(seq 1 10); do
            actual=$(gh api "repos/${{ github.repository }}/branches/feature/develop" --jq .commit.sha 2>/dev/null || echo "")
            if [ "$actual" = "$expected" ]; then
              echo "GitHub has registered the push ($actual)."
              exit 0
            fi
            echo "Attempt $i: GitHub not yet updated, retrying in 5s..."
            sleep 5
          done
          echo "Timed out waiting for GitHub to register the push." >&2
          exit 1

      - name: Trigger feature CI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering the feature CI pipeline..."
          gh workflow run ci.yml --ref feature/develop
