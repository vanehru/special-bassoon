name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to deploy (see Actions tab URL). Leave blank when redeploying from a fresh CI success.'
        required: false
        default: ''
  workflow_run:
    workflows:
      - Feature Develop CI Pipeline
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/develop')
    runs-on: ubuntu-latest

    # You can define environment variables at the job level to reuse across steps
    env:
      DATABASE_HOST: ${{ vars.DB_HOST }}
      DATABASE_NAME: ${{ vars.DB_NAME }}
      DATABASE_USER: ${{ vars.DB_USER }}

    steps:
      - name: Resolve CI run to deploy
        id: resolve
        run: |
          run_id="${{ github.event.inputs.ci_run_id || github.event.workflow_run.id }}"
          if [ -z "$run_id" ]; then
            echo "workflow_dispatch requires ci_run_id when there is no workflow_run event." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout code at CI commit
        uses: actions/checkout@v4
        with:
          # workflow_run jobs default github.ref to the default branch, NOT the
          # commit CI actually validated - pin explicitly to the CI run's head_sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download build artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Environment
        env:
          # Injecting the secret safely into this specific execution step
          DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CI_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          echo "Connecting to database host: $DATABASE_HOST"
          echo "Using database: $DATABASE_NAME with user: $DATABASE_USER"
          echo "Deploying artifact built by CI run: $CI_RUN_ID"
          cat dist/build-info.txt || true

          # Your actual deployment or migration commands go here:
          # e.g., my-deployment-script.sh --host $DATABASE_HOST --pass $DATABASE_PASSWORD
