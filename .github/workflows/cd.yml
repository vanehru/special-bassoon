name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      ci_run_number:
        description: 'CI run # to redeploy, as shown in the Actions tab (e.g. 17, not the internal run ID). Leave blank to require a fresh CI success.'
        required: false
        default: ''
  workflow_run:
    workflows:
      - Feature Develop CI Pipeline
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/develop')
    runs-on: ubuntu-latest

    # You can define environment variables at the job level to reuse across steps
    env:
      DATABASE_HOST: ${{ vars.DB_HOST }}
      DATABASE_NAME: ${{ vars.DB_NAME }}
      DATABASE_USER: ${{ vars.DB_USER }}

    steps:
      - name: Resolve CI run to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.event.inputs.ci_run_number }}
        run: |
          if [ -n "$RUN_NUMBER" ]; then
            echo "Looking up CI run #$RUN_NUMBER via the GitHub API..."
            run_json=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.run_number == ${RUN_NUMBER})][0]")
            run_id=$(echo "$run_json" | jq -r '.id // empty')
            head_sha=$(echo "$run_json" | jq -r '.head_sha // empty')
            if [ -z "$run_id" ]; then
              echo "No CI run found with run number $RUN_NUMBER (check the Actions tab)." >&2
              exit 1
            fi
          else
            run_id="${{ github.event.workflow_run.id }}"
            head_sha="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$run_id" ]; then
            echo "workflow_dispatch requires ci_run_number when there is no workflow_run event." >&2
            exit 1
          fi
          echo "Deploying artifact from CI run id $run_id (commit ${head_sha:-unknown})"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout code at CI commit
        uses: actions/checkout@v4
        with:
          # workflow_run jobs default github.ref/github.sha to the default branch,
          # NOT the commit that CI run actually validated - pin explicitly so an
          # old redeploy checks out the old code, not today's develop tip.
          ref: ${{ steps.resolve.outputs.head_sha || github.sha }}

      - name: Download build artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Environment
        env:
          # Injecting the secret safely into this specific execution step
          DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CI_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          echo "Connecting to database host: $DATABASE_HOST"
          echo "Using database: $DATABASE_NAME with user: $DATABASE_USER"
          echo "Deploying artifact built by CI run: $CI_RUN_ID"
          cat dist/build-info.txt || true

          # Your actual deployment or migration commands go here:
          # e.g., my-deployment-script.sh --host $DATABASE_HOST --pass $DATABASE_PASSWORD
