name: Feature Develop CI Pipeline

run-name: "Feature CI - ${{ github.ref_name }} - run #${{ github.run_number }}"

"on":
  push:
    branches:
      - feature/develop
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup your environment here (Example: Node.js) ---
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '24'

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          # npm ci / pip install / linting setup goes here

      - name: Run Build & Tests
        run: |
          echo "Running test suites and verifying build compatibility..."
          # npm test / pytest / go test goes here
          mkdir -p dist
          echo "Build artifact from commit ${{ github.sha }}" > dist/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
